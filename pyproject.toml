[build-system]
requires = ["setuptools>=82"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-contract-test"
version = "0.1.0"
description = "Framework-neutral behavioral contract testing for AI agents"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Aniket Deshkar" }]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Testing",
]
dependencies = [
  "jsonschema[format]>=4.26,<5",
  "pydantic>=2.13,<3",
  "PyYAML>=6.0.3,<7",
]

[project.optional-dependencies]
dev = [
  "build>=1.4,<2",
  "pytest>=9.1,<10",
  "ruff>=0.16.3,<0.17",
]

[project.scripts]
agent-contract-test = "agent_contract_test.cli:main"
actest = "agent_contract_test.cli:main"

[project.entry-points.pytest11]
agent_contract_test = "agent_contract_test.pytest_plugin"

[project.urls]
Homepage = "https://github.com/aniket-deshkar/agent-contract-test"
Repository = "https://github.com/aniket-deshkar/agent-contract-test"
Issues = "https://github.com/aniket-deshkar/agent-contract-test/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
