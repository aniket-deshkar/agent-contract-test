version: "1"
name: place-order-contract
description: An order agent must check inventory before creating an order.
input:
  customer_id: customer-7
  sku: book-42
  quantity: 2
expect:
  required_tool_calls:
    - name: check_inventory
      arguments:
        sku: book-42
        quantity: 2
    - name: create_order
      arguments:
        customer_id: customer-7
  forbidden_tool_calls:
    - issue_refund
  tool_order:
    - check_inventory
    - create_order
  max_agent_steps: 4
  max_model_calls: 2
  max_tokens: 500
  max_cost: 0.01
  approvals:
    - tool: create_order
      required: true
      granted: true
  response_schema:
    type: object
    required: [order_id, status]
    additionalProperties: false
    properties:
      order_id:
        type: string
        minLength: 1
      status:
        const: accepted
